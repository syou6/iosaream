name: OkiMissionDemo
options:
  bundleIdPrefix: com.okimission
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja

packages:
  OkiMission:
    path: .

targets:
  OkiMissionDemo:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Voices/**"
    resources:
      - path: App/Voices
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OkiMission
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAlarmKitUsageDescription: 起床アラームを設定するために必要です
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.okimission.demo
            CFBundleURLSchemes:
              - okimission
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.okimission.demo
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: OkiMission
        product: OkiMissionCore
      - package: OkiMission
        product: OkiMissionServices
      - package: OkiMission
        product: OkiMissionVoicePack
      - package: OkiMission
        product: OkiMissionPlatformKit
      - package: OkiMission
        product: OkiMissionFeatureKit
      - package: OkiMission
        product: OkiMissionDesignSystem
